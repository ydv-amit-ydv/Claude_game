<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Last Garden — Admin</title>
<style>
:root{--bg:#10180f;--panel:#182218;--ink:#eef6e9;--dim:#9db09a;--leaf:#5fbb56;--gold:#f2b23f;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font:700 19px Georgia,serif;color:var(--leaf);white-space:nowrap}
header input{padding:9px 11px;font:700 15px system-ui;letter-spacing:3px;text-transform:uppercase;background:#222e21;border:1px solid var(--line);border-radius:7px;color:var(--ink);width:140px}
header button{padding:9px 16px;font:700 13px system-ui;background:var(--leaf);color:#0d1a0c;border:0;border-radius:7px;cursor:pointer}
.tag{padding:5px 11px;border-radius:20px;background:rgba(95,187,86,.16);color:var(--leaf);font-weight:700;font-size:12.5px}
.tag.warn{background:rgba(242,178,63,.16);color:var(--gold)}
#status{color:var(--dim);font-size:12.5px}
main{flex:1;display:flex;min-height:0}
#mapWrap{flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#1d2a1c,#10180f);padding:14px;min-width:0}
canvas{image-rendering:pixelated;max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#side{width:320px;background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow-y:auto;flex-shrink:0}
#side h2{font:700 13px Georgia,serif;color:var(--leaf);margin:16px 0 7px;letter-spacing:.3px}
#side h2:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:5px 3px;border-bottom:1px solid var(--line)}
td.rank{color:var(--dim);width:26px}
td.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
td.val{text-align:right;color:var(--gold);font-weight:700;white-space:nowrap}
td.sub{text-align:right;color:var(--dim);font-size:11px;white-space:nowrap}
.fin{color:var(--leaf)}
#hist div{font-size:12px;color:var(--dim);margin-bottom:9px;padding-bottom:9px;border-bottom:1px dashed var(--line);line-height:1.7}
#hist b{color:var(--ink)}
#legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--dim);margin-top:10px}
#legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
#empty{margin:auto;max-width:320px;text-align:center;color:var(--dim);line-height:1.7}
@media(max-width:820px){main{flex-direction:column}#side{width:100%;border-left:0;border-top:1px solid var(--line);max-height:44vh}}
</style>
</head>
<body>
<header>
  <h1>The Last Garden · Admin</h1>
  <input id="code" maxlength="6" placeholder="TOURNEY ID">
  <button id="go" type="button">Watch</button>
  <span class="tag" id="stageTag">—</span>
  <span class="tag warn" id="timeTag"></span>
  <span id="status">Enter a tournament ID to watch it live.</span>
</header>
<main>
  <div id="mapWrap">
    <div id="empty">Aerial view of any tournament. Type its 6-character ID above — you'll see the whole maze, every runner, every passerby, and the live standings.</div>
    <canvas id="g" style="display:none"></canvas>
  </div>
  <div id="side">
    <h2>Live standings</h2>
    <table id="lbTable"><tbody></tbody></table>
    <div id="legend">
      <span><i class="dot" style="background:#ffd36b"></i>Top 3</span>
      <span><i class="dot" style="background:#7fd2ff"></i>Runner</span>
      <span><i class="dot" style="background:#5fbb56"></i>At shrine</span>
      <span><i class="dot" style="background:#f2884f"></i>Passerby</span>
      <span><i class="dot" style="background:#f2b23f"></i>Chest</span>
    </div>
    <h2>Stage history</h2>
    <div id="hist"></div>
    <h2 id="champHead" style="display:none">Champion</h2>
    <div id="champ" style="color:var(--gold);font-weight:700;font-size:15px"></div>
  </div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const cv = $('g'), ctx = cv.getContext('2d');
let W = 0, H = 0, grid = null, goal = 0, T = 6;
let players = [], npcs = [], chests = [];
let mazeLayer = null;

function buildMaze() {
  const wrap = $('mapWrap');
  T = Math.max(3, Math.min(Math.floor((wrap.clientWidth - 40) / W), Math.floor((wrap.clientHeight - 40) / H)));
  cv.width = W * T; cv.height = H * T;
  mazeLayer = document.createElement('canvas');
  mazeLayer.width = W; mazeLayer.height = H;
  const c = mazeLayer.getContext('2d'), img = c.createImageData(W, H), d = img.data;
  for (let i = 0; i < W * H; i++) {
    const wall = grid[i] === 1, o = i * 4;
    d[o] = wall ? 58 : 226; d[o + 1] = wall ? 122 : 210; d[o + 2] = wall ? 62 : 168; d[o + 3] = 255;
  }
  c.putImageData(img, 0, 0);
  render();
}

function render() {
  if (!mazeLayer) return;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mazeLayer, 0, 0, cv.width, cv.height);
  const k = T, gx = goal % W, gy = (goal / W) | 0;

  for (const [t, v] of chests) {
    const x = t % W, y = (t / W) | 0;
    ctx.fillStyle = '#f2b23f';
    ctx.fillRect(x * k + k * .2, y * k + k * .2, Math.max(2, k * .6), Math.max(2, k * .6));
  }
  // shrine
  ctx.fillStyle = 'rgba(255,236,160,.35)';
  ctx.beginPath(); ctx.arc((gx + .5) * k, (gy + .5) * k, k * 4, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#ffe07a';
  ctx.beginPath(); ctx.arc((gx + .5) * k, (gy + .5) * k, Math.max(4, k * 1.6), 0, 6.283); ctx.fill();

  for (const [x, y] of npcs) {
    ctx.fillStyle = '#f2884f';
    ctx.beginPath(); ctx.arc((x + .5) * k, (y + .5) * k, Math.max(2, k * .7), 0, 6.283); ctx.fill();
  }
  const ranked = [...players].sort((a, b) => b[6] - a[6]);
  ranked.forEach((p, i) => {
    const [id, n, x, y, money, fin] = p;
    ctx.fillStyle = fin ? '#5fbb56' : (i < 3 ? '#ffd36b' : '#7fd2ff');
    ctx.beginPath(); ctx.arc((x + .5) * k, (y + .5) * k, Math.max(2.5, k * (i < 3 ? 1.1 : .85)), 0, 6.283); ctx.fill();
    if (i < 3) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke(); }
  });
}

function renderLb(rows) {
  const tb = $('lbTable').querySelector('tbody'); tb.textContent = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    const c1 = document.createElement('td'); c1.className = 'rank'; c1.textContent = '#' + (i + 1);
    const c2 = document.createElement('td'); c2.className = 'name'; c2.textContent = r[0];
    const c3 = document.createElement('td'); c3.className = 'val'; c3.textContent = r[1] + ' pts';
    const c4 = document.createElement('td'); c4.className = 'sub'; c4.textContent = r[2] + 'g · ' + r[3] + '%';
    tr.append(c1, c2, c3, c4); tb.appendChild(tr);
  });
}

function renderHist(history) {
  const h = $('hist'); h.textContent = '';
  if (!history || !history.length) { h.innerHTML = '<div>No stage has finished yet.</div>'; return; }
  history.forEach(s => {
    const d = document.createElement('div');
    const head = document.createElement('b'); head.textContent = s.name;
    d.appendChild(head); d.appendChild(document.createElement('br'));
    s.top.slice(0, 5).forEach((r, i) => {
      d.appendChild(document.createTextNode(`#${i + 1} ${r[0]} — ${r[1]} pts (${r[2]}g, ${r[3]}%)`));
      d.appendChild(document.createElement('br'));
    });
    h.appendChild(d);
  });
}

let ws;
function connect(code) {
  const base = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
  ws = new WebSocket(base);
  ws.onopen = () => { $('status').textContent = 'connecting…'; ws.send(JSON.stringify({ t: 'admin', code })); };
  ws.onclose = () => { $('status').textContent = 'disconnected'; };
  ws.onmessage = e => handle(JSON.parse(e.data));
}

function handle(m) {
  switch (m.t) {
    case 'err': $('status').textContent = m.msg; break;
    case 'adminHi':
      $('status').textContent = 'watching ' + m.code;
      $('stageTag').textContent = m.stage.name + ' · cap ' + m.stage.cap + ' · ' + m.phase;
      renderHist(m.history);
      if (m.champion) { $('champHead').style.display = 'block'; $('champ').textContent = m.champion; }
      $('empty').style.display = 'none'; cv.style.display = 'block';
      break;
    case 'adminMaze': {
      W = m.W; H = m.H; goal = m.goal;
      const g = new Uint8Array(W * H);
      for (let i = 0; i < g.length; i++) g[i] = m.g.charCodeAt(i) - 48;
      grid = g;
      chests = (m.chests || []).map(c => [c[1], c[2]]);
      players = []; npcs = [];
      buildMaze();
      break;
    }
    case 'adminPos':
      players = m.p || []; npcs = m.n || []; render();
      break;
    case 'adminMeta':
      $('timeTag').textContent = m.n + ' racing · ' + m.tl + 's left';
      renderLb(m.lb);
      break;
    case 'adminStage':
      $('stageTag').textContent = m.stage.name + ' · cap ' + m.stage.cap + ' · ' + m.phase;
      renderHist(m.history);
      if (m.champion) { $('champHead').style.display = 'block'; $('champ').textContent = m.champion; }
      break;
  }
}

addEventListener('resize', () => { if (grid) buildMaze(); });
$('go').onclick = () => {
  const code = $('code').value.trim().toUpperCase();
  if (code.length !== 6) { $('status').textContent = 'enter a 6-character ID'; return; }
  connect(code);
};
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
const q = new URLSearchParams(location.search).get('code');
if (q) { $('code').value = q; $('go').click(); }
</script>
</body>
</html>
